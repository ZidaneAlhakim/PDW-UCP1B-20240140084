<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia - Tech Community</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Tech Community</div>
        <ul class="nav-links">
            <li><a href="./index.html">⬅ Kembali ke Home</a></li>
        </ul>
    </nav>

    <main class="container">
        <h2>Galeri & Multimedia</h2>
        
        <div class="gallery-grid">
            <div class="media-card">
                <h3>Podcast Komunitas</h3>
                <audio id="myAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
                <div class="audio-controls">
                    <button id="playBtn" class="btn-submit">Play Audio</button>
                    <button id="pauseBtn" class="btn-submit" style="background-color: #EF4444;">Pause</button>
                </div>
            </div>

            <div class="media-card">
                <h3>Dokumentasi Kegiatan</h3>
                <img id="galleryImage" src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=500&q=80" alt="Tech Event" style="width:100%; border-radius: 8px;">
                <button id="changeImgBtn" class="btn-submit" style="margin-top: 10px;">Ganti Gambar</button>
            </div>

            <div class="media-card">
                <h3>Tutorial Terbaru</h3>
                <iframe width="100%" height="250" src="https://www.youtube.com/embed/jBzwzrDvZ18" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 8px;"></iframe>
            </div>
        </div>
    </main>

    <script src="gallery-script.js"></script>
</body>
</html>
